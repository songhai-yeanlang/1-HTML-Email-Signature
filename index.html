<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Signature</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f1f1f1;">

    <!-- HTML Email Signature -->
    <!-- Wrapper table for presentation (can be removed when copying to email client) -->
    <table cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color: #f1f1f1; padding: 40px 20px;">
        <tr>
            <td align="center">

                <!-- Main Signature Table (Width between 400px - 600px as requested) -->
                <table cellpadding="0" cellspacing="0" border="0" width="550" style="font-family: Arial, Helvetica, sans-serif; background-color: #ffffff; border-radius: 12px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
                    <tr>
                        <!-- Left: Profile Image -->
                        <td width="160" valign="middle" align="center">
                            <!-- Update the src="" with the actual absolute URL of the profile image -->
                            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTfWnyk9GWP3WrUuJrj7qvFUwMnbo9NGxVLyz6C4tsLeA&s=10" width="150" height="180" alt="Sherrie Pinney" style="display: block; border-radius: 10px; object-fit: cover;">
                        </td>
                        
                        <!-- Middle Spacer -->
                        <td width="20"></td>
                        
                        <!-- Right: Details -->
                        <td width="370" valign="middle">
                            <table cellpadding="0" cellspacing="0" border="0" width="100%">
                                <!-- Name -->
                                <tr>
                                    <td align="center" style="font-size: 26px; font-weight: bold; color: #555555; text-transform: uppercase; letter-spacing: 1px; padding-bottom: 5px;">
                                      ENTER YOUR NAME
                                    </td>
                                </tr>
                                <!-- Job Title -->
                                <tr>
                                    <td align="center" style="font-size: 16px; color: #777777; padding-bottom: 12px;">
                                        Managing Director
                                    </td>
                                </tr>
                                <!-- Cyan Divider Line -->
                                <tr>
                                    <td align="center" style="padding-bottom: 15px;">
                                        <table cellpadding="0" cellspacing="0" border="0">
                                            <tr>
                                                <td width="220" height="2" style="background-color: #00b4d8; line-height: 2px; font-size: 2px;">&nbsp;</td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>
                                <!-- Address -->
                                <tr>
                                    <td align="center" style="font-size: 13px; color: #777777; padding-bottom: 12px; line-height: 1.4;">
                                        Church road,Rory Rory Avenue, Los Angeles
                                    </td>
                                </tr>
                                <!-- Contact Details -->
                                <tr>
                                    <td align="center" style="padding-bottom: 15px;">
                                        <table cellpadding="0" cellspacing="0" border="0" style="margin: 0 auto;">
                                            <tr>
                                                <td valign="middle">
                                                    <img src="https://img.icons8.com/ios-filled/50/00b4d8/phone.png" width="14" height="14" alt="Phone" style="display: block;">
                                                </td>
                                                <td width="5"></td>
                                                <td valign="middle" style="font-size: 13px; color: #777777;">
                                                    +123 456 789
                                                </td>
                                                <td width="10"></td>
                                                <td valign="middle" style="font-size: 14px; color: #cccccc;">|</td>
                                                <td width="10"></td>
                                                <td valign="middle">
                                                    <img src="https://img.icons8.com/ios-filled/50/00b4d8/new-post.png" width="14" height="14" alt="Email" style="display: block;">
                                                </td>
                                                <td width="5"></td>
                                                <td valign="middle" style="font-size: 13px;">
                                                    <a href="#" style="color: #777777; text-decoration: none;">info@example.com</a>
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>
                                <!-- Social Media Icons -->
                                <tr>
                                    <td align="center">
                                        <table cellpadding="0" cellspacing="0" border="0" style="margin: 0 auto;">
                                            <tr>
                                                <td>
                                                    <a href="#"><img src="https://img.icons8.com/ios-filled/50/00b4d8/facebook-new.png" width="20" height="20" alt="Facebook" style="display: block; border: 0;"></a>
                                                </td>
                                                <td width="12"></td>
                                                <td>
                                                    <a href="#"><img src="https://img.icons8.com/ios-filled/50/00b4d8/skype.png" width="20" height="20" alt="Skype" style="display: block; border: 0;"></a>
                                                </td>
                                                <td width="12"></td>
                                                <td>
                                                    <a href="#"><img src="https://img.icons8.com/ios-filled/50/00b4d8/twitter.png" width="20" height="20" alt="Twitter" style="display: block; border: 0;"></a>
                                                </td>
                                                <td width="12"></td>
                                                <td>
                                                    <a href="#"><img src="https://img.icons8.com/ios-filled/50/00b4d8/linkedin.png" width="20" height="20" alt="LinkedIn" style="display: block; border: 0;"></a>
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                </table>
                <!-- End Main Signature Table -->

            </td>
        </tr>
    </table>

</body>
</html>
